[project]
name = "aws-pasto"
version = "0.1.0"
description = "Agentes de IA en AWS: charla y demos del AWS User Group Pasto"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "boto3>=1.44.5",
    "botocore[crt]>=1.44.5",
    "fastapi>=0.164.0",
    "httpx>=0.28.1",
    "openai>=3.55.0",
    "python-dotenv>=1.2.4",
    "strands-agents>=1.65.0",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
infra = [
    "aws-cdk-lib>=2.277.0",
    "constructs>=10.8.1",
]
